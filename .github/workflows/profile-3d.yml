name: Generate Profile 3D

# Vygeneruje izometrický 3D graf tvojich príspevkov za posledný rok.
# Ukladá do priečinka profile-3d-contrib/ v Branch "main".

on:
  schedule:
    # Každé 4 hodiny, na 40. minúte (UTC)
    # Náš čas v lete = +2h → 02:40, 06:40, 10:40, 14:40, 18:40, 22:40
    - cron: "40 */4 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-3d.yml

concurrency:
  group: profile-3d
  cancel-in-progress: true

jobs:
  generate:
    name: Render 3D contribution calendar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render 3D SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet && echo "Bez zmien, nič sa necommituje." && exit 0
          git commit -q -m "chore: update 3D contrib [skip ci]"
          git push
