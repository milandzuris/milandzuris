name: GitHub Profile 3D Contrib

on:
  schedule:
    # 3D contrib — 00:17 a 12:17 SK času (leto/CEST = UTC+2)
    # V zime (CET = UTC+1) posuň obe hodiny o +1: 23 a 11
    - cron: "17 22 * * *"
    - cron: "17 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # SETTING_JSON: ./profile-3d-settings.json   # ak chceš vlastné farby

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib
          git diff --staged --quiet || git commit -m "chore: update 3d contrib [skip ci]"
          git push
