#Generate Snake
#Had, ktorý žerie tvoj Contribution graf. Naležato na celú šírku, tyrkysová farba.
#Ukladá do Branch snake (nie do Branch main), README ho berie odtiaľ (úplne dole).
name: Generate Snake

on:
  #Každé 4 hodiny (00:30, 04:30, 08:30 …) slovenského času
  schedule:
    - cron: "30 */4 * * *"
      timezone: "Europe/Bratislava"
  #Ručné spustenie (tlačidlo Run workflow)
  workflow_dispatch:
  #Po zmene tohto workflowu
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions: {}

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  snake:
    name: Generate Snake
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Snake Render
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#22d3ee&color_dots=#1c2128,#155e75,#0891b2,#22d3ee,#67e8f9

      - name: Snake Branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: snake
          build_dir: dist
          commit_message: "Generate Snake: Update Snake"
        env:
          GITHUB_TOKEN: ${{ github.token }}
