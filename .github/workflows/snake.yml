name: Generate Snake

on:
  schedule:
    # Snake — 00:07 a 12:07 SK času (leto/CEST = UTC+2)
    # V zime (CET = UTC+1) posuň obe hodiny o +1: 23 a 11
    - cron: "7 22 * * *"
    - cron: "7 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a371f7
            dist/ocean.gif?color_snake=#a371f7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
