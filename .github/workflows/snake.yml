name: Generate Snake

# Vygeneruje animáciu hada, ktorý žerie tvoj contribution graf.
# Výsledok ukladá do Branch "snake" — NIE do "main".

on:
  schedule:
    # Každé 4 hodiny, na 30. minúte. Cron beží v UTC!
    # Náš čas v lete (CEST) = +2h → 02:30, 06:30, 10:30, 14:30, 18:30, 22:30
    # V zime (CET) = +1h → o hodinu skôr. Cron sa neprepína sám.
    - cron: "30 */4 * * *"

  # Ručné spustenie tlačidlom "Run workflow" v záložke Actions
  workflow_dispatch:

  # Pri pushi len ak si zmenil tento súbor. Úprava README nič nespúšťa.
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

# Starší bežiaci beh sa zruší namiesto hromadenia fronty
concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    name: Render snake SVG
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Render snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a371f7

      - name: Push to snake Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: snake
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
