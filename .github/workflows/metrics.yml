name: Generate Metrics

# Vygeneruje dva veľké informačné panely o tvojom účte.
# Ukladá do priečinka assets/ v Branch "main".
#
# POZOR: vyžaduje secret METRICS_TOKEN (classic PAT).
# Vstavaný GITHUB_TOKEN tu nestačí — číta dáta z celého účtu.

on:
  schedule:
    # Každé 4 hodiny, na 50. minúte (UTC)
    # Náš čas v lete = +2h → 02:50, 06:50, 10:50, 14:50, 18:50, 22:50
    - cron: "50 */4 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:

  # ── Panel 1 → assets/metrics-1.svg ──────────────────────────────
  # Aktivita, komunita, repozitáre, jazyky, kalendár, followeri
  panel-one:
    name: Render panel 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-1.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Bratislava
          extras_css: |
            body { background: #0c0a08 !important; color: #fafaf9 !important;
                   font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif !important; }
            h2 { color: #f97316 !important; letter-spacing: -0.01em; }
            a { color: #f97316 !important; }
            .field, .row, .value { color: rgba(250,250,249,0.6) !important; }
          config_display: large

          plugin_languages: yes
          plugin_languages_indepth: no      # yes = klonuje repá, +10-25 min
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: no

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

  # ── Panel 2 → assets/metrics-2.svg ──────────────────────────────
  # Notable contributions, naposledy hviezdičkované repozitáre
  panel-two:
    name: Render panel 2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: panel-one        # za sebou, aby si joby netlačili commit naraz
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-2.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Europe/Bratislava
          extras_css: |
            body { background: #0c0a08 !important; color: #fafaf9 !important;
                   font-family: Inter, -apple-system, BlinkMacSystemFont, sans-serif !important; }
            h2 { color: #f97316 !important; letter-spacing: -0.01em; }
            a { color: #f97316 !important; }
            .field, .row, .value { color: rgba(250,250,249,0.6) !important; }

          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_notable_indepth: no
          plugin_notable_types: commit

          plugin_stars: yes
          plugin_stars_limit: 4
