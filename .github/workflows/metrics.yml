name: Metrics

on:
  schedule:
    # Metrics — 00:27 a 12:27 SK času (leto/CEST = UTC+2)
    # V zime (CET = UTC+1) posuň obe hodiny o +1: 23 a 11
    - cron: "27 22 * * *"
    - cron: "27 10 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────
  # PANEL 1  →  assets/metrics-1.svg
  # Activity • Community stats • Repositories • Languages
  # Issues/PR status • Contributions calendar • Followers
  # ─────────────────────────────────────────────────────────────
  panel-one:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-1.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Bratislava
          config_display: large

          # Najviac používané jazyky (indepth = ráta reálne riadky kódu)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage

          # Stav issues a pull requestov
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes

          # Izometrický kalendár + commit streaky
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Followeri / following (tie avatarové mriežky dole)
          plugin_people: yes
          plugin_people_limit: 24
          plugin_people_size: 28
          plugin_people_types: followers, following

  # ─────────────────────────────────────────────────────────────
  # PANEL 2  →  assets/metrics-2.svg
  # Notable contributions • Recently starred repositories
  # ─────────────────────────────────────────────────────────────
  panel-two:
    runs-on: ubuntu-latest
    needs: panel-one          # aby si oba joby netlačili commit naraz
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-2.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Europe/Bratislava

          # Repozitáre, do ktorých si prispel mimo vlastných
          plugin_notable: yes
          plugin_notable_repositories: yes
          plugin_notable_indepth: yes
          plugin_notable_types: commit

          # Naposledy hviezdičkované repá
          plugin_stars: yes
          plugin_stars_limit: 4

          # Voliteľné, ak by si chcel aj témy, ktoré sleduješ:
          # plugin_topics: yes
          # plugin_topics_mode: starred
          # plugin_topics_limit: 12

  # ─────────────────────────────────────────────────────────────
  # PANEL 3  →  assets/metrics-3.svg
  # Náhrada za trophy karty (github-profile-trophy.vercel.app)
  # Generuje sa lokálne, nezávisí na cudzom serveri
  # ─────────────────────────────────────────────────────────────
  panel-three:
    runs-on: ubuntu-latest
    needs: panel-two          # serializované, aby si joby netlačili commit naraz
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: assets/metrics-3.svg
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: Europe/Bratislava

          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0
