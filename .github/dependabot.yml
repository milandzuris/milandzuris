#Dependabot
#Každý pondelok o 16:00 skontroluje všetky GitHub Actions vo workflowoch a Python balíčky.
#Keď je nová verzia → PR v tomto repe, priradený tebe (zamkne ho Pull Request Lock). Merge = aktualizované.
version: 2
updates:
  #GitHub Actions (checkout, setup-python, snk, ghaction-github-pages)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "16:00"
      timezone: "Europe/Bratislava"
    assignees:
      - "milandzuris"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "Dependabot"

  #Python balíčky pre Generate Activity (fonttools)
  - package-ecosystem: "pip"
    directory: "/.github/activity"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "16:00"
      timezone: "Europe/Bratislava"
    assignees:
      - "milandzuris"
    commit-message:
      prefix: "Dependabot"
