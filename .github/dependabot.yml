#Dependabot
#Každý pondelok o 16:00 skontroluje všetky GitHub Actions vo workflowoch.
#Keď je nová verzia → PR v tomto repe, priradený tebe (zamkne ho Pull Request Lock). Merge = aktualizované.
version: 2
updates:
  #GitHub Actions (checkout, metrics, snk, ghaction-github-pages)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "16:00"
      timezone: "Europe/Bratislava"
    assignees:
      - "milandzuris"
    groups:
      github-actions:
        patterns:
          - "*"
    #metrics v4 nefunguje ako GitHub Action (chýba action.yml) → ostávame na v3
    ignore:
      - dependency-name: "lowlighter/metrics"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: "Dependabot"
